server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

  # API: /gw/... -> API gateway (prefix stripped). Change the host to wherever your gateway runs.
  location /gw/ {
    proxy_pass http://api-gateway:9000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Hashed build assets can be cached forever; index.html must always be revalidated.
  location ~* \.(js|css|woff2?|ico|svg|png|jpg)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
